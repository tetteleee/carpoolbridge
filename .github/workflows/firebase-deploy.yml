name: Firebase Deploy

on:
  workflow_run:
    workflows: ["E2E Tests"]
    types: [completed]
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    # E2E Tests（Lint含む）がmainブランチで成功した場合のみデプロイする。
    # E2E Testsがpaths-ignore（docs/**, tasks/**のみの変更）で起動しなかった場合は
    # このworkflow_runイベント自体が発生しないため、デプロイも従来通りスキップされる。
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_runイベントはデフォルトでdefaultブランチをcheckoutするため、
          # E2E Testsを実際にトリガーしたコミットを明示的に指定する。
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # firestore.rules（Security Rules）はHostingとは別経路でデプロイする必要があるため、
      # ここで明示的に実行する。Hostingより先に反映することで、新しいクライアントコードが
      # 対応するルールより先に配信される期間（=権限エラーが起きうる期間）を作らないようにする。
      - name: Deploy Firestore Rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase deploy --only firestore:rules --project carpoolbridge --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: carpoolbridge
          channelId: live

      # 公開版（build:public）は自チーム版とは別のFirebaseプロジェクト（carpoolbridge-go）へ
      # デプロイする。Firestoreを使わないためRulesデプロイは不要。自チーム版側のステップが
      # 失敗しても公開版のデプロイは独立して実行されるよう if: always() を付ける。
      # ref: docs/12_公開版配布・ホスティング設計.md#4
      - name: Build (public)
        if: always()
        run: npm run build:public

      - name: Deploy Firebase Hosting (public)
        if: always()
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PUBLIC }}
          projectId: carpoolbridge-go
          channelId: live
